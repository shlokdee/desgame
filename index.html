<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>desgames</title>
</head>
<body>
    <h1>desgames</h1>
    <h2>a set of minigames to test your design skills!</h2>

    <div class="selector">
        <div class="gamecard align">
            <h3> align </h3>
            <p>align the objects as best as you can!</p>
            <button onClick="location.href='/games/align.html'">Align</button>
        </div>
        <div class="gamecard colorpicker">
            <h3>colorpicker</h3>
            <p>pick the right matching color from the color wheel!</p>
         <button onClick="location.href='/games/colorpicker.html'">Color Picker</button>

        </div>
        <div class="gamecard eyeball">
            <h3>eyeball</h3>
            <p>get a shape to draw and try to recreate it as closely as possible!</p>
            <button onClick="location.href='/games/eyeball.html'">Eyeball</button>

        </div>
    </div>
</body>
</html>
