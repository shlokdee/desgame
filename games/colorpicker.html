<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colorpicker</title>
    <link rel="stylesheet" href="colorpicker.css">


</head>
<body>
    <h1>colorpicker</h1>
    <a href="../index.html">Go back</a>
    <p>match the color using the color wheel and get scored on your accuracy! :p</p>

    <div class="gamecard">
        <div class="card given">
            <div id="colorbox"></div>
            <p>this is your color</p>
        </div>
        <div class="card choose">
            <input type="color" id="colorpicker">
            <label for="colorpicker">Pick your color here!</label>
            <button>submit!</button>
        </div>

    </div>

    <button id="mainbutton">Start</button>
</body>
</html>
